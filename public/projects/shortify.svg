<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021b2b"/>
      <stop offset="50%" stop-color="#072b42"/>
      <stop offset="100%" stop-color="#04121d"/>
    </linearGradient>
    <linearGradient id="sh-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="sh-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e3450" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#072033" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="sh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sh-bg)"/>

  <!-- Circuit grid lines -->
  <g stroke="#134769" stroke-width="0.5" stroke-opacity="0.4">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M80 0 V450 M160 0 V450 M240 0 V450 M320 0 V450 M400 0 V450 M480 0 V450 M560 0 V450 M640 0 V450 M720 0 V450"/>
  </g>

  <!-- Ambient orbs -->
  <circle cx="680" cy="90" r="140" fill="#00f2fe" opacity="0.08" filter="url(#sh-glow)"/>
  <circle cx="120" cy="380" r="150" fill="#38bdf8" opacity="0.07" filter="url(#sh-glow)"/>

  <!-- Top Header Bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="url(#sh-card)" stroke="#1e547a" stroke-width="1"/>
  <circle cx="65" cy="52" r="5" fill="#ef4444"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="125" y="57" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">SHORTIFY — ENTERPRISE URL SHORTENER &amp; ANALYTICS API</text>

  <!-- Status Pill -->
  <g transform="translate(620, 42)">
    <rect width="125" height="20" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3.5" fill="#38bdf8" filter="url(#sh-glow)"/>
    <text x="24" y="14" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CLEAN ARCH</text>
  </g>

  <!-- Left Main Panel: URL Redirection & Analytics Engine -->
  <rect x="40" y="90" width="450" height="325" rx="12" fill="url(#sh-card)" stroke="#1e547a" stroke-width="1.2"/>
  <text x="65" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HIGH-THROUGHPUT REDIRECTION ENGINE</text>

  <!-- Interactive URL Transformer Box -->
  <g transform="translate(65, 145)">
    <rect width="400" height="75" rx="8" fill="#082236" stroke="#1b4d70" stroke-width="1"/>
    
    <text x="15" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">ORIGINAL DESTINATION URL:</text>
    <text x="15" y="40" fill="#cbd5e1" font-family="monospace" font-size="10">https://engineering.enterprise.internal/reports/v2/q4-metrics</text>

    <!-- Arrow down -->
    <path d="M190 48 L200 55 L210 48" stroke="#00f2fe" stroke-width="1.5" fill="none"/>

    <text x="15" y="65" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">SHORTENED LINK:</text>
    <text x="110" y="65" fill="#00f2fe" font-family="monospace" font-size="11" font-weight="700">shortify.dev/k8s-q4</text>
    
    <rect x="315" y="48" width="70" height="20" rx="4" fill="#0369a1"/>
    <text x="325" y="62" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">2.4ms REDIR</text>
  </g>

  <!-- Analytics & Latency Metrics Grid -->
  <g transform="translate(65, 235)">
    <!-- Total Clicks Box -->
    <rect width="125" height="65" rx="8" fill="#082236" stroke="#1b4d70" stroke-width="1"/>
    <text x="12" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">TOTAL CLICKS</text>
    <text x="12" y="50" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="800">128.4K</text>

    <!-- Cache Hit Ratio -->
    <rect x="138" width="125" height="65" rx="8" fill="#082236" stroke="#1b4d70" stroke-width="1"/>
    <text x="150" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">CACHE HIT RATE</text>
    <text x="150" y="50" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">99.2%</text>

    <!-- Rate Limiter Box -->
    <rect x="276" width="125" height="65" rx="8" fill="#082236" stroke="#1b4d70" stroke-width="1"/>
    <text x="288" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">RATE LIMITING</text>
    <text x="288" y="50" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="800">ENFORCED</text>
  </g>

  <!-- Click Velocity Chart Bar -->
  <g transform="translate(65, 315)">
    <rect width="400" height="85" rx="8" fill="#061a29" stroke="#123a54" stroke-width="1"/>
    <text x="15" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" font-weight="600">HOURLY CLICK DISTRIBUTION &amp; GEOLOCATION TRACKING</text>

    <!-- Mini Bar Chart -->
    <rect x="25" y="35" width="20" height="35" rx="2" fill="#0284c7"/>
    <rect x="55" y="45" width="20" height="25" rx="2" fill="#0284c7"/>
    <rect x="85" y="30" width="20" height="40" rx="2" fill="#0284c7"/>
    <rect x="115" y="20" width="20" height="50" rx="2" fill="#38bdf8"/>
    <rect x="145" y="25" width="20" height="45" rx="2" fill="#0284c7"/>
    <rect x="175" y="40" width="20" height="30" rx="2" fill="#0284c7"/>
    <rect x="205" y="28" width="20" height="42" rx="2" fill="#0284c7"/>
    <rect x="235" y="15" width="20" height="55" rx="2" fill="#38bdf8" filter="url(#sh-glow)"/>
    <rect x="265" y="32" width="20" height="38" rx="2" fill="#0284c7"/>
    <rect x="295" y="42" width="20" height="28" rx="2" fill="#0284c7"/>
    <rect x="325" y="50" width="20" height="20" rx="2" fill="#0284c7"/>
    <rect x="355" y="38" width="20" height="32" rx="2" fill="#0284c7"/>
  </g>

  <!-- Right Panel: Clean Architecture Layer Diagram -->
  <rect x="510" y="90" width="250" height="325" rx="12" fill="url(#sh-card)" stroke="#1e547a" stroke-width="1.2"/>
  <text x="530" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CLEAN ARCHITECTURE</text>

  <!-- Layer 1: Controllers -->
  <g transform="translate(530, 145)">
    <rect width="210" height="42" rx="6" fill="#082236" stroke="#38bdf8" stroke-width="1"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1. Controllers Layer</text>
    <text x="12" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">HTTP request parsing &amp; DTO validation</text>
  </g>

  <!-- Layer 2: Services -->
  <g transform="translate(530, 200)">
    <rect width="210" height="42" rx="6" fill="#082236" stroke="#0ea5e9" stroke-width="1"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">2. Business Services Layer</text>
    <text x="12" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Collision checks, hashing &amp; analytics</text>
  </g>

  <!-- Layer 3: Repositories -->
  <g transform="translate(530, 255)">
    <rect width="210" height="42" rx="6" fill="#082236" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">3. Repositories Layer</text>
    <text x="12" y="34" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5">MongoDB queries &amp; index management</text>
  </g>

  <!-- Layer 4: SOLID Standards -->
  <g transform="translate(530, 310)">
    <rect width="210" height="90" rx="6" fill="#041524" stroke="#164e63" stroke-width="1"/>
    <text x="12" y="20" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ENGINEERING PRACTICES</text>
    <text x="12" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">• Strict TypeScript compilation</text>
    <text x="12" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">• Dependency Injection pattern</text>
    <text x="12" y="64" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">• Global Async Error Middlewares</text>
    <text x="12" y="78" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8.5">• Compound indexes on shortened slugs</text>
  </g>
</svg>

