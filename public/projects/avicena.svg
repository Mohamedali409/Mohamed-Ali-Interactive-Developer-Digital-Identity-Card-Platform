<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051329"/>
      <stop offset="50%" stop-color="#0a2342"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="av-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="av-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142c4a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1b2d" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="av-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="av-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#av-bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1e3a5f" stroke-width="0.5" stroke-opacity="0.4">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800"/>
    <path d="M50 0 V450 M100 0 V450 M150 0 V450 M200 0 V450 M250 0 V450 M300 0 V450 M350 0 V450 M400 0 V450 M450 0 V450 M500 0 V450 M550 0 V450 M600 0 V450 M650 0 V450 M700 0 V450 M750 0 V450"/>
  </g>

  <!-- Ambient Glow Circles -->
  <circle cx="680" cy="90" r="140" fill="#00f2fe" opacity="0.08" filter="url(#av-glow)"/>
  <circle cx="120" cy="380" r="160" fill="#10b981" opacity="0.07" filter="url(#av-glow)"/>

  <!-- Top Platform Header Bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="url(#av-card)" stroke="#224263" stroke-width="1"/>
  <circle cx="65" cy="52" r="5" fill="#ef4444"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="125" y="57" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">AVICENA PLATFORM — CLINICAL HEALTHCARE ARCHITECTURE</text>
  
  <!-- Live WebSocket Pulse Badge -->
  <g transform="translate(620, 42)">
    <rect width="125" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3.5" fill="#10b981" filter="url(#av-glow)"/>
    <text x="24" y="14" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.5">WEBSOCKETS LIVE</text>
  </g>

  <!-- Left Main Panel: Clinical Telemetry & Patient Metrics -->
  <rect x="40" y="90" width="440" height="325" rx="12" fill="url(#av-card)" stroke="#1e3a5f" stroke-width="1.2"/>
  
  <text x="65" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">TELEMETRY &amp; PATIENT VITALS</text>
  <text x="65" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Active Consultations • Real-Time Health Feeds</text>

  <!-- Metric Badges Row -->
  <g transform="translate(65, 165)">
    <!-- Heart Rate Box -->
    <rect width="115" height="65" rx="8" fill="#0f2137" stroke="#1e3a5f" stroke-width="1"/>
    <text x="12" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">HEART RATE</text>
    <text x="12" y="50" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="20" font-weight="800">72 <tspan font-size="10" fill="#94a3b8" font-weight="500">BPM</tspan></text>
    
    <!-- SpO2 Box -->
    <rect x="130" width="115" height="65" rx="8" fill="#0f2137" stroke="#1e3a5f" stroke-width="1"/>
    <text x="142" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">OXYGEN (SpO2)</text>
    <text x="142" y="50" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="20" font-weight="800">98.5 <tspan font-size="10" fill="#94a3b8" font-weight="500">%</tspan></text>

    <!-- Lab Tests Box -->
    <rect x="260" width="130" height="65" rx="8" fill="#0f2137" stroke="#1e3a5f" stroke-width="1"/>
    <text x="272" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">QDRANT VECTOR RAG</text>
    <text x="272" y="50" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="800">SYNCHRONIZED</text>
  </g>

  <!-- Real-Time ECG Pulse Waveform Graph -->
  <g transform="translate(65, 255)">
    <rect width="390" height="135" rx="8" fill="#0a1829" stroke="#17314d" stroke-width="1"/>
    <path d="M0 65 L40 65 L55 65 L65 40 L75 90 L85 20 L95 100 L105 65 L150 65 L170 65 L180 35 L190 95 L200 65 L260 65 L275 65 L285 45 L295 85 L305 15 L315 105 L325 65 L390 65" 
          fill="none" stroke="url(#av-cyan)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#av-glow)"/>
    <text x="12" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">LIVE SENSOR TELEMETRY FEED (WEBRTC / SOCKET.IO)</text>
    <text x="310" y="122" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="600">LATENCY: 14ms</text>
  </g>

  <!-- Right Panel: Backend & Cloud Architecture Diagram -->
  <rect x="500" y="90" width="260" height="325" rx="12" fill="url(#av-card)" stroke="#1e3a5f" stroke-width="1.2"/>
  <text x="520" y="125" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">SYSTEM ARCHITECTURE</text>
  
  <!-- Architecture Node 1: Node.js & Express API Gateway -->
  <g transform="translate(520, 145)">
    <rect width="220" height="42" rx="6" fill="#0f243c" stroke="#38bdf8" stroke-width="1"/>
    <text x="14" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">API Gateway / Express.js</text>
    <text x="14" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">JWT Auth • RBAC • Rate Limiter</text>
  </g>

  <!-- Down Arrow -->
  <path d="M630 192 V204" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Architecture Node 2: BullMQ Queues & Workers -->
  <g transform="translate(520, 210)">
    <rect width="220" height="42" rx="6" fill="#0f243c" stroke="#f59e0b" stroke-width="1"/>
    <text x="14" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">BullMQ &amp; Background Workers</text>
    <text x="14" y="34" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9">Medication Reminders • Job Queues</text>
  </g>

  <!-- Down Arrow -->
  <path d="M630 257 V269" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Architecture Node 3: Qdrant Vector & MongoDB -->
  <g transform="translate(520, 275)">
    <rect width="220" height="42" rx="6" fill="#0f243c" stroke="#10b981" stroke-width="1"/>
    <text x="14" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Qdrant Vector DB &amp; MongoDB</text>
    <text x="14" y="34" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9">Medical Report RAG • Replica Set</text>
  </g>

  <!-- Architecture Node 4: Docker & Kubernetes Infrastructure -->
  <g transform="translate(520, 335)">
    <rect width="220" height="55" rx="6" fill="#091b2e" stroke="#6366f1" stroke-width="1"/>
    <text x="14" y="20" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">DOCKER &amp; KUBERNETES INFRA</text>
    <text x="14" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Nginx Ingress • Prometheus • Grafana</text>
    <text x="14" y="47" fill="#818cf8" font-family="system-ui, sans-serif" font-size="9">Terraform Provisioned Cluster</text>
  </g>
</svg>
