<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111d" />
      <stop offset="50%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Grid -->
  <g opacity="0.06" stroke="#10b981" stroke-width="1">
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid2)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="240" cy="200" r="220" fill="url(#accentGlow)" filter="url(#glow)" />
  <circle cx="960" cy="480" r="240" fill="url(#accentGlow)" filter="url(#glow)" />

  <!-- Center Fitness & AI Graphic -->
  <g transform="translate(600, 220)">
    <!-- Concentric Target Circles / Metric rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#1e293b" stroke-width="2" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="140 30" opacity="0.8" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="90 20" opacity="0.8" />

    <!-- Center Badge -->
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#glow)" />
    
    <!-- Dumbbell / Lightning AI Icon -->
    <path d="M -30 -18 L -30 18 M -22 -24 L -22 24 M -22 0 L 22 0 M 22 -24 L 22 24 M 30 -18 L 30 18" 
          stroke="#10b981" stroke-width="5" stroke-linecap="round" />
    <polygon points="4,-12 -6,2 2,2 -4,14 8,0 0,0" fill="#f59e0b" filter="url(#glow)" />
  </g>

  <!-- Title & Details -->
  <text x="600" y="380" font-family="'Segoe UI', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    FITMATE AI
  </text>
  <text x="600" y="425" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="3">
    INTELLIGENT FITNESS • NUTRITION ENGINE • AI COACHING
  </text>
  <text x="600" y="470" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Personalized Workout Algorithms • Macronutrient Intelligence • Full-Stack TypeScript • Node.js • Redis
  </text>

  <!-- Feature Badges -->
  <g transform="translate(600, 540)">
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#10b981" text-anchor="middle">AI Workout Plan</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#06b6d4" text-anchor="middle">Nutrition Track</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#3b82f6" text-anchor="middle">Progress Graphs</text>
    </g>
    <g transform="translate(240, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#eab308" text-anchor="middle">Conversational AI</text>
    </g>
  </g>
</svg>
