<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#141f36"/>
      <stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="pos-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="pos-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="pos-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#pos-bg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.35">
    <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800 M0 420 H800"/>
    <path d="M80 0 V450 M160 0 V450 M240 0 V450 M320 0 V450 M400 0 V450 M480 0 V450 M560 0 V450 M640 0 V450 M720 0 V450"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="680" cy="110" r="140" fill="#f59e0b" opacity="0.08" filter="url(#pos-glow)"/>
  <circle cx="150" cy="360" r="140" fill="#3b82f6" opacity="0.08" filter="url(#pos-glow)"/>

  <!-- Top Header Bar -->
  <rect x="40" y="30" width="720" height="44" rx="8" fill="url(#pos-card)" stroke="#334155" stroke-width="1"/>
  <circle cx="65" cy="52" r="5" fill="#ef4444"/>
  <circle cx="82" cy="52" r="5" fill="#f59e0b"/>
  <circle cx="99" cy="52" r="5" fill="#10b981"/>
  <text x="125" y="57" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">RESTAURANT POS &amp; INVENTORY PLATFORM — LAYERED MERN ARCHITECTURE</text>

  <!-- CI/CD Status Pill -->
  <g transform="translate(615, 42)">
    <rect width="130" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3.5" fill="#10b981" filter="url(#pos-glow)"/>
    <text x="24" y="14" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CI/CD PASSING</text>
  </g>

  <!-- Left Main Panel: POS Terminal & Daily Inventory -->
  <rect x="40" y="90" width="450" height="325" rx="12" fill="url(#pos-card)" stroke="#334155" stroke-width="1.2"/>
  <text x="65" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">LIVE ORDERS &amp; INGREDIENT INVENTORY</text>

  <!-- Order Ticket Summary Row -->
  <g transform="translate(65, 145)">
    <!-- Active Orders Card -->
    <rect width="125" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">ACTIVE ORDERS</text>
    <text x="12" y="50" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="22" font-weight="800">48 <tspan font-size="10" fill="#94a3b8">table &amp; take</tspan></text>

    <!-- Daily Revenue Card -->
    <rect x="138" width="125" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="150" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">DAILY SALES</text>
    <text x="150" y="50" fill="#10b981" font-family="system-ui, sans-serif" font-size="22" font-weight="800">$4,280</text>

    <!-- Low Stock Alert -->
    <rect x="276" width="125" height="65" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="288" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">STOCK ALERTS</text>
    <text x="288" y="50" fill="#ef4444" font-family="system-ui, sans-serif" font-size="22" font-weight="800">3 <tspan font-size="10" fill="#94a3b8">items low</tspan></text>
  </g>

  <!-- Live Orders Feed Table -->
  <g transform="translate(65, 230)">
    <rect width="400" height="165" rx="8" fill="#0a0f1d" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect width="400" height="28" rx="6" fill="#1e293b"/>
    <text x="15" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">TICKET #</text>
    <text x="90" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">BRANCH</text>
    <text x="190" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">ITEMS</text>
    <text x="290" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">TOTAL</text>
    <text x="350" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">STATUS</text>

    <!-- Row 1 -->
    <text x="15" y="56" fill="#f1f5f9" font-family="monospace" font-size="10">#1084</text>
    <text x="90" y="56" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Main Branch</text>
    <text x="190" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">3 items (Steak, Truffle)</text>
    <text x="290" y="56" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="600">$84.50</text>
    <rect x="345" y="44" width="46" height="16" rx="4" fill="#064e3b"/>
    <text x="352" y="55" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">READY</text>

    <line x1="10" y1="70" x2="390" y2="70" stroke="#1e293b"/>

    <!-- Row 2 -->
    <text x="15" y="96" fill="#f1f5f9" font-family="monospace" font-size="10">#1085</text>
    <text x="90" y="96" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Downtown</text>
    <text x="190" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">4 items (Burger Trio)</text>
    <text x="290" y="96" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="600">$52.00</text>
    <rect x="345" y="84" width="46" height="16" rx="4" fill="#78350f"/>
    <text x="352" y="95" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">PREP</text>

    <line x1="10" y1="110" x2="390" y2="110" stroke="#1e293b"/>

    <!-- Row 3 -->
    <text x="15" y="136" fill="#f1f5f9" font-family="monospace" font-size="10">#1086</text>
    <text x="90" y="136" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">West Branch</text>
    <text x="190" y="136" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">2 items (Salmon Bowl)</text>
    <text x="290" y="136" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="600">$44.00</text>
    <rect x="345" y="124" width="46" height="16" rx="4" fill="#1e3a8a"/>
    <text x="352" y="135" fill="#bfdbfe" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700">NEW</text>
  </g>

  <!-- Right Panel: Engineering & QA Architecture -->
  <rect x="510" y="90" width="250" height="325" rx="12" fill="url(#pos-card)" stroke="#334155" stroke-width="1.2"/>
  <text x="530" y="125" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">MOHAMED'S ROLE &amp; WORKFLOW</text>

  <!-- Card 1: Codebase Audit & Bugfixes -->
  <g transform="translate(530, 145)">
    <rect width="210" height="52" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Codebase Audit &amp; Bug Fixing</text>
    <text x="12" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Fixed 11 critical backend &amp; auth bugs</text>
    <text x="12" y="46" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="8.5">Refactored Layered Controller-Service</text>
  </g>

  <!-- Card 2: Automated Testing -->
  <g transform="translate(530, 210)">
    <rect width="210" height="52" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="20" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Jest &amp; Supertest Test Suite</text>
    <text x="12" y="34" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Authentication, Products, &amp; Orders</text>
    <text x="12" y="46" fill="#34d399" font-family="system-ui, sans-serif" font-size="8.5">Mocked DB transactions &amp; endpoints</text>
  </g>

  <!-- Card 3: 4 GitHub Actions Workflows -->
  <g transform="translate(530, 275)">
    <rect width="210" height="60" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="12" y="18" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10" font-weight="700">4x GitHub Actions CI/CD</text>
    <text x="12" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">• CI automated unit &amp; integration tests</text>
    <text x="12" y="44" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">• CD automated deployment to Vercel</text>
    <text x="12" y="56" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="8.5">• Gitleaks PR checks &amp; dependency bot</text>
  </g>
</svg>

