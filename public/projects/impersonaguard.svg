<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b" />
      <stop offset="50%" stop-color="#18112d" />
      <stop offset="100%" stop-color="#08070f" />
    </linearGradient>
    <linearGradient id="purpleRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Security Grid -->
  <g opacity="0.06" stroke="#8b5cf6" stroke-width="1">
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="675" fill="url(#grid3)" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="260" cy="190" r="220" fill="url(#accentGlow)" filter="url(#glow)" />
  <circle cx="940" cy="490" r="240" fill="url(#accentGlow)" filter="url(#glow)" />

  <!-- Center Security Shield Graphic -->
  <g transform="translate(600, 220)">
    <!-- Hexagonal Security Perimeter -->
    <polygon points="0,-130 112,-65 112,65 0,130 -112,65 -112,-65" 
             fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.3" stroke-dasharray="10 8" />
    
    <!-- Central Badge -->
    <rect x="-60" y="-60" width="120" height="120" rx="30" fill="#0f172a" stroke="#8b5cf6" stroke-width="3" filter="url(#glow)" />
    
    <!-- Shield & Check / Keyhole -->
    <path d="M 0 -36 Q 30 -36 30 -6 Q 30 32 0 44 Q -30 32 -30 -6 Q -30 -36 0 -36 Z" 
          fill="none" stroke="url(#purpleRed)" stroke-width="4" filter="url(#glow)" />
    <path d="M -10 -2 L -2 6 L 12 -8" 
          fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Details -->
  <text x="600" y="380" font-family="'Segoe UI', -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    IMPERSONAGUARD
  </text>
  <text x="600" y="425" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#ec4899" text-anchor="middle" letter-spacing="3">
    AI SECURITY • BRAND IMPERSONATION • PHISHING DETECTION
  </text>
  <text x="600" y="470" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">
    Automated Threat Detection Engine • Heuristic Analysis • Secure RESTful APIs • Redis • Docker
  </text>

  <!-- Feature Badges -->
  <g transform="translate(600, 540)">
    <g transform="translate(-240, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#8b5cf6" text-anchor="middle">Threat Scoring</text>
    </g>
    <g transform="translate(-80, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#ec4899" text-anchor="middle">Brand Guard</text>
    </g>
    <g transform="translate(80, 0)">
      <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle">Anti-Phishing</text>
    </g>
    <g transform="translate(240, 0)">
      <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="0" y="5" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">Secure Backend</text>
    </g>
  </g>
</svg>
