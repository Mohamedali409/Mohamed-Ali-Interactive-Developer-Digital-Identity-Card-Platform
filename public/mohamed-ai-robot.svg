<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="botGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="100" cy="100" r="85" fill="#06b6d4" opacity="0.15" filter="url(#botGlow)" />

  <!-- Robot Head Outline -->
  <rect x="40" y="55" width="120" height="95" rx="28" fill="#0f172a" stroke="url(#botGrad)" stroke-width="4" filter="url(#botGlow)" />

  <!-- Antenna -->
  <line x1="100" y1="55" x2="100" y2="30" stroke="#06b6d4" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="24" r="8" fill="#3b82f6" filter="url(#botGlow)" />

  <!-- Ears / Audio nodes -->
  <rect x="28" y="85" width="12" height="35" rx="6" fill="#3b82f6" />
  <rect x="160" y="85" width="12" height="35" rx="6" fill="#3b82f6" />

  <!-- Visor / Eyes display screen -->
  <rect x="55" y="75" width="90" height="42" rx="14" fill="#020617" stroke="#1e293b" stroke-width="2" />
  
  <!-- Glowing Eyes -->
  <circle cx="80" cy="96" r="10" fill="#06b6d4" filter="url(#botGlow)" />
  <circle cx="80" cy="96" r="4" fill="#ffffff" />
  <circle cx="120" cy="96" r="10" fill="#06b6d4" filter="url(#botGlow)" />
  <circle cx="120" cy="96" r="4" fill="#ffffff" />

  <!-- Cheerful Mouth / Soundwave line -->
  <path d="M 82 132 Q 100 142 118 132" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
</svg>
